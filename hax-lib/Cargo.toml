[package]
name = "hax-lib"
version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
edition = "2021"
repository.workspace = true
readme = "README.md"
description = "Hax-specific helpers for Rust programs"



[dependencies]
hax-lib-macros = { workspace = true, optional = true }
num-bigint = { version = "0.4", default-features = false }
num-traits = { version = "0.2", default-features = false }


[features]
default = ["macros"]
macros = ["dep:hax-lib-macros"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(hax)'] }

[package.metadata.docs.rs]
# `--cfg hax` also has to reach rustc: otherwise Cargo does not see the `hax`
# cfg and leaves the `[target.'cfg(hax)'.dependencies]` unresolved.
rustc-args = ["--cfg", "hax"]
rustdoc-args = ["--cfg", "hax"]
